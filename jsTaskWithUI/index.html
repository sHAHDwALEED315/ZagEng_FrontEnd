<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>  
  <form class="operation">
    <p>CalCulator</p>
    <div>
      <input type="number" id="num1" placeholder="Enter Namber 1">
      <input type="text" id="ope" placeholder="Enter +, -, * or /">
      <input type="number" id="num2" placeholder="Enter Namber 2">
      <button id="calbtn" type="button">Result</button>
      <p id="display1">00</p>
    </div>
  </form>
  <form class="operation">
    <p>Even Or Odd</p>
    <div>
      <input type="number" id="num-even-odd" placeholder="Enter a Namber to show it's Even or Odd">
      <button id="eo-btn" type="button">Result</button>
      <p id="display2">00</p>
    </div>
  </form>
  <form class="operation">
    <p>Grade System</p>
    <div>
      <input type="number" id="grade" placeholder="Enter the Grade">
      <button id="gradebtn" type="button">Result</button>
      <p id="display3">00</p>
    </div>
  </form>
  <section class="operation">
    <p>Sum</p>
    <div>
      <button id="sumbtn" type="button">Result</button>
      <p id="display4">00</p>
    </div>
  </section>
  <form class="operation">
    <p>Largest Number</p>
    <div>
      <input type="number" id="numl1" placeholder="Enter Namber 1">
      <input type="number" id="numl2" placeholder="Enter Namber 2">
      <input type="number" id="numl3" placeholder="Enter Namber 3">
      <button id="lbtn" type="button">Result</button>
      <p id="display5">00</p>
    </div>
  </form>
  <form class="operation">
    <p>Multiplication Table</p>
    <div>
      <input type="number" id="num-table" placeholder="Enter a Namber to show its Multiblication Table">
      <button id="mulbtn" type="button">Result</button>
      <p id="display6">00</p>
    </div>
  </form>
  <script src="script.js"></script>
</body>
</html>
